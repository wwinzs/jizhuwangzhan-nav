<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>v1.9 Auth UI smoke</title></head>
<body data-test-status="pending"><pre id="result">running</pre><iframe id="site" style="width:980px;height:780px"></iframe>
<script>
(async function () {
  var key='jizhuwangzhan-nav:v1',backup=localStorage.getItem(key);
  var frame=document.getElementById('site'),checks=0,requests=[],rejectNetwork=false,loggedIn=false;
  var savedPassword='a safe test password', liveSessions=3, confirmCount=0;
  function ok(cond,msg){checks++;if(!cond)throw Error('FAIL: '+msg);}
  function el(id){return frame.contentDocument.getElementById(id);}
  function sleep(){return new Promise(function(resolve){setTimeout(resolve,110);});}
  try {
    localStorage.removeItem(key);
    await new Promise(function(resolve,reject){
      frame.onload=resolve;frame.onerror=reject;
      frame.src='../index.html?auth-test='+Date.now();
    });
    await sleep();
    ok(!!frame.contentWindow.NavAuth,'auth client loaded');
    ok(el('accountButton').hidden,'account entry disabled until deployment');
    ok(!el('accountDialog').open,'account dialog closed initially');
    ok(el('tiles').querySelectorAll('.tile').length>0,'existing local homepage still renders');
    var existingData=localStorage.getItem(key);
    frame.contentWindow.confirm=function(){confirmCount++;return true;};
    frame.contentWindow.fetch=function(url,opts){
      requests.push({url:url,options:opts});
      if(rejectNetwork)return Promise.reject(new TypeError('offline'));
      var route=String(url).split('/').slice(-2).join('/');
      var status=200,data;
      if(route==='auth/me'){
        if(loggedIn)data={user:{email:'owner@example.com',role:'owner'}};
        else {status=401;data={error:'Not authenticated'};}
      } else if(route==='auth/login'){
        var args=JSON.parse(opts.body);
        if(args.email==='owner@example.com'&&args.password===savedPassword){
          loggedIn=true;data={user:{email:'owner@example.com',role:'owner'}};
        }else{status=401;data={error:'Invalid credentials'};}
      } else if(route==='auth/change-password'){
        var passwordRequest=JSON.parse(opts.body);
        if(!loggedIn){status=401;data={error:'Not authenticated'};}
        else if(passwordRequest.current_password!==savedPassword){
          status=401;data={error:'Invalid current password'};
        }else{
          savedPassword=passwordRequest.new_password;
          loggedIn=false;data={ok:true,reauth_required:true};
        }
      } else if(route==='auth/sessions'){
        if(!loggedIn){status=401;data={error:'Not authenticated'};}
        else {
          data={sessions:[]};
          for(var i=0;i<liveSessions;i++){
            data.sessions.push({
              created_at:'2026-10-20T06:00:00Z',
              expires_at:'2026-11-03T06:00:00Z',
              current:i===0
            });
          }
        }
      } else if(route==='sessions/revoke-others'){
        var revokeRequest=JSON.parse(opts.body);
        if(!loggedIn){status=401;data={error:'Not authenticated'};}
        else if(revokeRequest.confirm!==true){status=400;data={error:'Explicit confirmation required'};}
        else {data={ok:true,revoked_count:liveSessions-1};liveSessions=1;}
      } else if(route==='password-reset/request'){
        data={ok:true,message:'If this address is eligible, a reset email may arrive.'};
        status=202;
      } else if(route==='password-reset/confirm'){
        var resetArgs=JSON.parse(opts.body);
        if(resetArgs.token==='f'.repeat(64)){
          savedPassword=resetArgs.new_password;loggedIn=false;
          data={ok:true,reauth_required:true};
        }else{status=400;data={error:'Invalid or expired reset link'};}
      } else if(route==='auth/logout'){loggedIn=false;data={ok:true};}
      else {status=404;data={error:'Not found'};}
      return Promise.resolve({
        ok:status>=200&&status<300,status:status,json:function(){return Promise.resolve(data);}
      });
    };
    frame.contentWindow.NavAuth.initialize({enabled:true});
    await sleep();
    ok(el('accountButton').hidden,'cannot activate account on unrelated hostname');
    frame.contentWindow.NavAuth.initialize({enabled:true,testMode:true,apiBase:'http://127.0.0.1:8766'});
    await sleep();
    ok(!el('accountButton').hidden,'test origin can display optional login');
    ok(requests.some(function(r){return String(r.url).endsWith('/auth/me');}),'current session checked without login');
    ok(requests.every(function(r){return r.options.credentials==='include';}),'cookies explicitly included on API calls');
    el('accountButton').click();
    ok(el('accountDialog').open,'account dialog opens');
    ok(!el('accountSignedOut').hidden,'signed-out form shown');
    el('accountEmail').value='owner@example.com';
    el('accountPassword').value='incorrect';
    el('accountLoginForm').dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));
    await sleep();
    ok(el('accountMessage').textContent.includes('密码'),'invalid credentials receive error feedback');
    ok(!el('accountSignedOut').hidden,'invalid login does not become authenticated');
    el('accountPassword').value='a safe test password';
    el('accountLoginForm').dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));
    await sleep();
    ok(el('accountSignedOut').hidden,'valid login hides login form');
    ok(!el('accountSignedIn').hidden,'signed-in state is visible');
    ok(el('accountIdentity').textContent==='owner@example.com','account email displayed');
    ok(el('accountPassword').value==='','password cleared from input on success');
    var loginCall=requests.find(function(r){return String(r.url).endsWith('/auth/login');});
    ok(loginCall.options.credentials==='include'&&loginCall.options.method==='POST','login uses cookie POST');
    ok(loginCall.options.headers['Content-Type']==='application/json','login request JSON only');
    ok(localStorage.getItem(key)===existingData,'login does not modify saved bookmarks');
    ok(el('accountSessionsPanel').hidden,'login session manager is initially hidden');
    el('accountSessionsToggle').click();
    await sleep();
    ok(!el('accountSessionsPanel').hidden,'session manager opens');
    ok(el('accountSessionsList').children.length===3,'current and other sessions appear');
    ok(!el('accountRevokeOthers').disabled,'other session revocation available');
    ok(el('accountSessionsList').textContent.includes('当前会话'),'current session is clearly marked');
    el('accountRevokeOthers').click();
    await sleep();
    ok(confirmCount===1,'revoking other sessions requires explicit user confirmation');
    ok(el('accountSessionsList').children.length===1,'revoked other sessions disappear');
    ok(el('accountRevokeOthers').disabled,'cannot revoke others when none remain');
    ok(el('accountMessage').textContent.includes('当前设备仍保持登录'),'current login preserved after revoking others');
    var revokeCall=requests.find(function(r){return String(r.url).endsWith('/auth/sessions/revoke-others');});
    ok(!!revokeCall && revokeCall.options.credentials==='include' && revokeCall.options.method==='POST','session revocation uses authenticated POST');
    ok(JSON.parse(revokeCall.options.body).confirm===true,'revoke request must include confirmation');
    ok(localStorage.getItem(key)===existingData,'session management preserves local bookmarks');
    ok(el('accountChangePasswordForm').hidden,'password form initially hidden');
    el('accountChangePasswordToggle').click();
    ok(!el('accountChangePasswordForm').hidden,'password change form opened');
    ok(el('accountChangePasswordToggle').getAttribute('aria-expanded')==='true','password form accessible expanded state');
    el('accountCurrentPassword').value='incorrect old password';
    el('accountNewPassword').value='a different safe test password';
    el('accountConfirmPassword').value='a different safe test password';
    el('accountChangePasswordForm').dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));
    await sleep();
    ok(el('accountMessage').textContent.includes('当前密码'),'wrong current password shows precise feedback');
    ok(!el('accountSignedIn').hidden,'wrong current password does not log out');
    el('accountCurrentPassword').value='a safe test password';
    el('accountConfirmPassword').value='not the same password';
    var callsBefore=requests.length;
    el('accountChangePasswordForm').dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));
    await sleep();
    ok(el('accountMessage').textContent.includes('两次'),'confirmation mismatch shows error');
    ok(requests.length===callsBefore,'mismatch never sends password to server');
    el('accountConfirmPassword').value='a different safe test password';
    el('accountChangePasswordForm').dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));
    await sleep();
    ok(!el('accountSignedOut').hidden,'password change requires new login');
    ok(el('accountChangePasswordForm').hidden,'password form is hidden on logout');
    ok(el('accountCurrentPassword').value===''&&el('accountNewPassword').value==='','password change fields cleared');
    ok(el('accountMessage').textContent.includes('所有设备'),'password rotation feedback explains session revocation');
    ok(localStorage.getItem(key)===existingData,'password rotation preserves local navigation');
    var changeCall=requests.find(function(r){return String(r.url).endsWith('/auth/change-password');});
    ok(changeCall.options.method==='POST'&&changeCall.options.credentials==='include','password change uses credentialed POST');
    ok(changeCall.options.headers['Content-Type']==='application/json','password change sends JSON');
    el('accountPassword').value='a different safe test password';
    el('accountLoginForm').dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));
    await sleep();
    ok(!el('accountSignedIn').hidden,'new password can log back in');
    el('accountLogout').click();await sleep();
    ok(!el('accountSignedOut').hidden,'logout returns to sign-in form');
    ok(el('accountMessage').textContent.includes('不会被删除'),'logout preserves local navigation');
    ok(localStorage.getItem(key)===existingData,'logout does not modify saved local data');
    ok(el('accountForgotForm').hidden,'recovery request form initially closed');
    el('accountForgotToggle').click();
    ok(!el('accountForgotForm').hidden,'forgot password form can open');
    el('accountResetEmail').value='unknown@example.com';
    el('accountForgotForm').dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));
    await sleep();
    ok(el('accountMessage').textContent.includes('如该邮箱符合'),'recovery request remains enumeration-safe');
    var requestCall=requests.find(function(r){return String(r.url).endsWith('/auth/password-reset/request');});
    ok(!!requestCall&&requestCall.options.method==='POST'&&requestCall.options.credentials==='include',
       'reset request is credentialed and originated from authorized UI');
    ok(el('accountResetEmail').value==='','request does not retain email');
    el('accountForgotCancel').click();
    ok(el('accountForgotForm').hidden,'forgot form cancel works');
    frame.contentWindow.location.hash='password-reset='+'f'.repeat(64);
    frame.contentWindow.NavAuth.initialize({enabled:true,testMode:true,apiBase:'http://127.0.0.1:8766'});
    await sleep();
    ok(frame.contentWindow.location.hash==='','reset fragment removed before request');
    ok(!el('accountResetForm').hidden,'valid reset link exposes confirmation form');
    var attempts=requests.length;
    el('accountResetNewPassword').value='a fully different long password 54321!';
    el('accountResetConfirmPassword').value='incorrect confirmation';
    el('accountResetForm').dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));
    await sleep();
    ok(requests.length===attempts,'password mismatch never sends reset token');
    el('accountResetConfirmPassword').value='a fully different long password 54321!';
    el('accountResetForm').dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));
    await sleep();
    ok(el('accountResetForm').hidden,'confirmation form hides on successful reset');
    ok(el('accountResetNewPassword').value===''&&el('accountResetConfirmPassword').value==='',
       'reset password inputs are cleared');
    ok(el('accountMessage').textContent.includes('已重置'),'user sees successful recovery status');
    var confirmCall=requests.find(function(r){return String(r.url).endsWith('/auth/password-reset/confirm');});
    ok(!!confirmCall&&JSON.parse(confirmCall.options.body).token==='f'.repeat(64),
       'reset fragment is sent only within credentialed JSON request');
    ok(localStorage.getItem(key)===existingData,'password recovery preserves local navigation');
    el('accountPassword').value='a fully different long password 54321!';
    el('accountLoginForm').dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));
    await sleep();
    ok(!el('accountSignedIn').hidden,'can log in with recovered password');
    el('accountLogout').click();await sleep();
    rejectNetwork=true;
    await frame.contentWindow.NavAuth.refresh();
    ok(el('accountMessage').textContent.includes('无法连接账号服务'),'network unavailable gives offline fallback');
    ok(!el('tiles').querySelectorAll('.tile').length===false,'offline account does not affect navigation');
    frame.contentWindow.NavAuth.initialize({enabled:false});
    ok(el('accountButton').hidden,'account feature can be disabled');
    document.body.dataset.testStatus='PASS';
    document.getElementById('result').textContent='PASS '+checks+' checks';
  } catch(err) {
    document.body.dataset.testStatus='FAIL';
    document.getElementById('result').textContent='FAIL '+checks+' checks: '+(err.stack||err);
  } finally {
    if(backup===null)localStorage.removeItem(key);else localStorage.setItem(key,backup);
  }
})();
</script></body></html>
