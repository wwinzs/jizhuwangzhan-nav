name: Validate navigation
on:
  push:
    branches: [main, feat/itab-navigation-v1]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check app.js
      - name: Required assets
        run: |
          test -s index.html
          test -s style.css
          test -s app.js
          test -s favicon.svg
      - name: Document references
        run: |
          grep -q 'app.js' index.html
          grep -q 'style.css' index.html
          grep -q 'favicon.svg' index.html
