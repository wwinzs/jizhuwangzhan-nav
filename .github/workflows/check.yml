name: Validate navigation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check app.js
      - name: Required assets
        run: |
          test -s index.html
          test -s style.css
          test -s desktop.css
          test -s minimal.css
          test -s tests/ui-smoke.html
          test -s app.js
          test -s favicon.svg
      - name: Document references
        run: |
          grep -q 'app.js' index.html
          grep -q 'style.css' index.html
          grep -q 'desktop.css' index.html
          grep -q 'minimal.css' index.html
          grep -q 'favicon.svg' index.html
      - name: Desktop stylesheet guard
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const css = fs.readFileSync('desktop.css', 'utf8') + '\n' + fs.readFileSync('minimal.css', 'utf8');
          const expected = ['.sidebar', '.tiles', '.tile-icon', '.search-form', '.widgets', '.link-context-menu', '@media(max-width:620px)'];
          for (const selector of expected) {
            if (!css.includes(selector)) throw new Error('Missing visual selector: ' + selector);
          }
          const left = (css.match(/\{/g) || []).length;
          const right = (css.match(/\}/g) || []).length;
          if (left !== right || !left) throw new Error('Unbalanced CSS braces');
          console.log('Desktop layout stylesheet contract OK');
          NODE
      - name: Install CJK font for screenshot rendering
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-wqy-microhei > /dev/null
      - name: Capture desktop and mobile layouts
        run: |
          set -eu
          BROWSER="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$BROWSER" ]; then
            echo "::warning::No Chrome executable; screenshot smoke test skipped"
            exit 0
          fi
          mkdir -p screenshots
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/nav-http.log 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:8765/ >/dev/null
          "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --virtual-time-budget=4500 --window-size=1440,900 --screenshot=screenshots/desktop.png http://127.0.0.1:8765/ || echo "::warning::Desktop screenshot failed"
          "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --virtual-time-budget=4500 --window-size=390,844 --screenshot=screenshots/mobile.png http://127.0.0.1:8765/ || echo "::warning::Mobile screenshot failed"
      - name: Browser interaction smoke test
        run: |
          set -eu
          BROWSER="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$BROWSER" ]; then
            echo "::error::Chrome is needed for browser interaction tests"
            exit 1
          fi
          python3 -m http.server 8766 --bind 127.0.0.1 >/tmp/nav-smoke-server.log 2>&1 &
          sleep 2
          "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=9500 --dump-dom http://127.0.0.1:8766/tests/ui-smoke.html > /tmp/nav-smoke-result.html 2>/tmp/nav-smoke-chrome.log
          if ! grep -q 'data-test-status="PASS"' /tmp/nav-smoke-result.html; then
            echo "::error::Browser interaction smoke test failed"
            grep -oE 'FAIL [^<]+' /tmp/nav-smoke-result.html || true
            tail -30 /tmp/nav-smoke-chrome.log || true
            exit 1
          fi
          grep -oE 'PASS [0-9]+ checks' /tmp/nav-smoke-result.html | head -1
      - name: Upload visual screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nav-visual-preview
          path: screenshots/
          if-no-files-found: ignore
